<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ - BT10 Nimbus</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<main class="shell">
    <nav class="topbar">
        <div>
            <span class="eyebrow">BEARER TOKEN ĐANG HOẠT ĐỘNG</span>
            <h1>Thông tin tài khoản</h1>
        </div>
        <button id="logout" class="ghost" type="button">Đăng xuất</button>
    </nav>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <section id="profile-card" class="card profile-card">
        <p class="muted">Đang gọi <code>GET /users/me</code>...</p>
    </section>

    <section class="card users-card">
        <div class="section-heading">
            <div>
                <h2>Danh sách người dùng</h2>
                <p class="muted"><code>GET /users</code> chỉ dành cho ADMIN.</p>
            </div>
            <button id="load-users" type="button">Tải danh sách</button>
        </div>
        <div id="users-result" class="table-wrap"></div>
    </section>
</main>
</body>
</html>
